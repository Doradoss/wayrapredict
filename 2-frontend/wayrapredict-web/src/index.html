<!doctype html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <title>WayraPredict</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vigilancia predictiva de la calidad del aire en zonas con actividad minero-industrial del Perú">
  <link rel="icon" type="image/svg+xml" href="simbolo-claro.svg?v=2" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/svg+xml" href="simbolo-oscuro.svg?v=2" media="(prefers-color-scheme: dark)">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
  <!-- Tema guardado (o el del sistema) antes de pintar, para evitar el parpadeo -->
  <script>
    try {
      var t = localStorage.getItem('wayra-tema');
      if (t !== 'claro' && t !== 'oscuro') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Sprite de iconos (trazo de 1.8 sobre una retícula de 24 × 24); se usan con <use href="#i-nombre"> -->
  <svg hidden xmlns="http://www.w3.org/2000/svg">
