spring.application.name=wayrapredict-api

# Base de datos: SOLO por variables de entorno (nunca escritas aquí).
# Host, puerto y base se comparten con el ML; usuario y contraseña son propios del backend (wayra_api),
# para no interferir con WAYRA_DB_USER / WAYRA_DB_PASSWORD que usa la carga del ML (10-CARGAR_BD.py).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${WAYRA_DB_HOST:localhost}:${WAYRA_DB_PORT:5432}/${WAYRA_DB_NAME:wayrapredict}
spring.datasource.username=${WAYRA_API_DB_USER}
spring.datasource.password=${WAYRA_API_DB_PASSWORD}

# El esquema lo crea y carga el ML (esquema_wayrapredict.sql): Hibernate solo VALIDA, nunca lo modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# JWT: clave (mínimo 64 caracteres para HS512) solo por variable de entorno
jwt.secret=${WAYRA_JWT_SECRET}
# Validez del token en milisegundos (7 h, como en la plantilla)
jwt.validez-ms=25200000

# Primer administrador (solo se crea si no existe ningún administrador)
wayra.admin.correo=${WAYRA_ADMIN_CORREO:}
wayra.admin.password=${WAYRA_ADMIN_PASSWORD:}

# Orígenes del frontend permitidos por CORS (separados por coma). Por defecto: Angular en desarrollo.
wayra.cors.origenes=${WAYRA_CORS_ORIGENES:http://localhost:4200}

# Asistente con Gemini (Interactions API, respuesta por partes). La clave SOLO por variable de entorno; si falta, el resto
# del backend funciona igual y el asistente responde 503.
# Modelo principal: gemini-3.6-flash con razonamiento mínimo (medido el 08/11/2026: primera palabra en ~3 s; gemini-3.8-flash
# tardaba más de 45 s en el plan gratuito). Para volver a 3.8: WAYRA_GEMINI_MODELO=gemini-3.8-flash.
wayra.gemini.api-key=${WAYRA_GEMINI_API_KEY:}
wayra.gemini.modelo=${WAYRA_GEMINI_MODELO:gemini-3.6-flash}
# Respaldos en orden (separados por coma) si el principal está saturado o tarda en empezar a responder
wayra.gemini.modelo-respaldo=${WAYRA_GEMINI_MODELO_RESPALDO:gemini-3.6-flash,gemini-3.5-flash-lite}
wayra.gemini.url=https://generativelanguage.googleapis.com/v1beta/interactions
wayra.gemini.api-revision=2026-05-20
# Razonamiento: minimal (más rápido), low, medium o high. Si un modelo no admite minimal, se usa low con él.
wayra.gemini.razonamiento=${WAYRA_GEMINI_RAZONAMIENTO:minimal}
# Tiempo máximo hasta la primera palabra antes de pasar al siguiente modelo (ms)
wayra.gemini.primer-texto-principal-ms=8000
wayra.gemini.primer-texto-respaldo-ms=15000
# Tiempo máximo de la respuesta completa (s)
wayra.gemini.timeout-segundos=45
wayra.gemini.max-tokens=2048
# Tras un fallo del modelo principal, cuánto tiempo ir directo al respaldo (ms)
wayra.gemini.pausa-principal-ms=60000
# Preguntas por minuto por cliente (protege la cuota de la API)
wayra.asistente.preguntas-por-minuto=10

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui/index.html

# Jackson 3 (Boot 4) ya escribe las fechas en formato ISO por defecto (antes: write-dates-as-timestamps=false)
spring.jackson.time-zone=America/Lima
server.port=${WAYRA_API_PORT:8080}
