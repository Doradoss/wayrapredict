# Despliegue del backend (Spring Boot) en Azure App Service.
# Se ejecuta cuando cambia algo en 1-backend/ o a mano desde la pestaña Actions.
name: Backend · Azure App Service

on:
  push:
    branches: [main]
    paths: ["1-backend/wayrapredict-api/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

jobs:
  compilar-y-desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1-backend/wayrapredict-api
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Pruebas unitarias (JWT y asistente). La prueba de contexto necesita la base de datos y se omite aquí.
      - name: Pruebas unitarias
        run: |
          chmod +x mvnw
          ./mvnw -B test -Dtest='JwtTokenUtilTest,AsistenteServiceTest,GeminiServiceTest'

      - name: Compilar el .jar
        run: ./mvnw -B package -DskipTests

      - name: Publicar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: wayrapredict-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 1-backend/wayrapredict-api/target/wayrapredict-api-*.jar
